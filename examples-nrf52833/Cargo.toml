[package]
name = "stcc4-nrf52833-example"
version = "0.1.0"
edition = "2024"

[dependencies]
# Embassy
embassy-executor = { version = "0.5.0", features = [
    "arch-cortex-m",
    "executor-thread",
    "defmt",
    "integrated-timers",
] }
embassy-time = { version = "0.3.0", features = [
    "defmt",
    "defmt-timestamp-uptime",
] }
embassy-nrf = { version = "0.2.0", features = [
    "defmt",
    "nrf52833",
    "time-driver-rtc1",
] }
embassy-embedded-hal = "0.2.0"

# Cortex-M runtime
cortex-m = { version = "0.7.7", features = ["critical-section-single-core"] }
cortex-m-rt = "0.7.4"
critical-section = { version = "1.2.0", features = ["restore-state-bool"] }

# Logging / panic
defmt = "0.3.6"
defmt-rtt = "0.4.1"
panic-probe = { version = "0.3.2", features = ["print-defmt"] }

# Driver
stcc4 = { path = "..", features = ["async", "defmt"] }

[profile.dev]
codegen-units = 1
incremental = false

[profile.release]
codegen-units = 1
lto = true
incremental = false
opt-level = "z"
